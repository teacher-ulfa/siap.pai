<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAP - SMAN 1 Krembung</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Html5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Optimized Print Styles for F4 Paper Size (215mm x 330mm) */
        @media print {
            @page {
                size: 215mm 330mm;
                margin: 10mm;
            }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 100%; 
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 10mm;
            }
            .print-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #9ca3af !important;
                border-radius: 6px;
                padding: 10px;
                background: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw9ayDKpnvGApYOASgfXNmLRvNjpy88doHA7LIzFFIydRYqlCdHk4ggLFQgA33HB5N3Nw/exec";
        const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1HF1Yw0ySUn61dxJ8iInQ_btIcA7owVgaoaYhPnU8d8k/edit?usp=sharing";
        
        const ADMIN_EMAILS = [
            'pembelajaranulfa@gmail.com', 
            'ulfatulhusna00@guru.sma.belajar.id', 
            'ulfatulhusna26@gmail.com'
        ];

        const GURU_PAI = [
            { nama: 'Ulfatul Husna, M.Pd.', nip: '197410101998022001', pangkat: 'IV/c - Pembina Utama Muda', email: 'pembelajaranulfa@gmail.com' },
            { nama: 'Muchammad Solichul Muhtadin, S.Pd.I', nip: '198911052025211030', pangkat: 'IX' },
            { nama: 'M. ZAIM AFFAN, S.Pd.I', nip: '199108082025211026', pangkat: 'IX' },
            { nama: 'ASRI WIYANTI, S.Pd.I', nip: '199304102025212037', pangkat: 'IX' },
            { nama: 'Anas Imron Hamza, S.Pd.', nip: '0', pangkat: 'Guru Tidak Tetap' }
        ];

        const KELAS_LIST = [
            'X-1', 'X-2', 'X-3', 'X-4', 'X-5', 'X-6', 'X-7', 'X-8', 'X-9', 'X-10', 'X-11', 'X-12',
            'XI-1', 'XI-2', 'XI-3', 'XI-4', 'XI-5', 'XI-6', 'XI-7', 'XI-8', 'XI-9', 'XI-10', 'XI-11', 'XI-12',
            'XII-1', 'XII-2', 'XII-3', 'XII-4', 'XII-5', 'XII-6', 'XII-7', 'XII-8', 'XII-9', 'XII-10', 'XII-11', 'XII-12'
        ];

        const INITIAL_SISWA_LIST = [
            { nis: '1001', nama: 'Abdullah Fachry', kelas: 'X-1' },
            { nis: '1002', nama: 'Aisyah Putri', kelas: 'X-1' },
            { nis: '1003', nama: 'Bagas Pratama', kelas: 'X-1' },
            { nis: '1004', nama: 'Citra Kirana', kelas: 'X-2' },
            { nis: '1005', nama: 'Deni Setiawan', kelas: 'X-2' },
            { nis: '1006', nama: 'Eka Sari', kelas: 'XI-1' },
            { nis: '1007', nama: 'Fajar Nugraha', kelas: 'XII-1' },
        ];

        const KATEGORI_PRESENSI = ['Kelas', 'Sholat Dhuha', 'Sholat Dzuhur', 'Sholat Ashar'];
        const STATUS_PRESENSI = ['Hadir', 'Sakit', 'Ijin', 'Alpha', 'Dispensasi'];
        const KATEGORI_DISIPLIN = ['Ringan', 'Sedang', 'Berat'];
        const POIN_DISIPLIN = { 'Ringan': 10, 'Sedang': 20, 'Berat': 40 };

        const Toast = ({ message, type, onClose }) => {
            React.useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500';
            return (
                <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50 fade-in`}>
                    {type === 'error' ? <i className="ph ph-warning-circle text-xl"></i> : <i className="ph ph-check-circle text-xl"></i>}
                    <span>{message}</span>
                </div>
            );
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Login = ({ onLogin, onPublicAccess }) => {
            const [nama, setNama] = React.useState('');
            const [nip, setNip] = React.useState('');
            const [error, setError] = React.useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                
                const user = GURU_PAI.find(g => g.nama.toLowerCase() === nama.toLowerCase() && g.nip === nip);
                
                if (user) {
                    let role = 'guru';
                    if (user.email && ADMIN_EMAILS.includes(user.email)) {
                        role = 'admin';
                    }
                    onLogin({ ...user, role }, 'dashboard');
                } else {
                    setError('Nama atau NIP tidak sesuai. Jika tidak memiliki NIP, masukkan angka 0.');
                }
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-white">
                    <div className="md:w-1/2 bg-emerald-600 text-white flex flex-col justify-center items-center p-6 md:p-10 text-center relative overflow-hidden">
                        <div className="bg-white p-2.5 rounded-full shadow-lg mb-4 z-10">
                             <img 
                                src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhjhEe7DsQaweQWtckuBY0QdRPB_J0RbHqfSXb0fFnNGOQYwfzbn9SyTV1WORteNpd7S3rcGj3FYpaCf0X7tjQpcXoDfErD-aWPD9kTf-6auJIoAZ3ETmXpvuoVydS7H87HO-vidqv4ECyayUG4dFJNZNMuVWD2lUyaMaF7ox5BYCfAksicgx7ryvy6V56Z/s1600/LOGO%20SMANIKRE%20(1).png" 
                                alt="Logo SMAN 1 Krembung" 
                                className="w-16 h-16 md:w-20 md:h-20 object-contain"
                            />
                        </div>
                        <h1 className="text-lg md:text-xl font-bold mb-2 text-center z-10">SMA Negeri 1 Krembung</h1>
                        
                        <p className="text-emerald-100 max-w-sm text-[8px] md:text-[9px] text-center font-medium leading-relaxed italic mb-5 z-10">
                            “TERBENTUKNYA MANUSIA YANG BERIMAN DAN BERTAQWA, BERAKHLAQ MULIA, BERPRESTASI, MANDIRI, SERTA BERBUDAYA LINGKUNGAN”
                        </p>
                        
                        <div className="w-full max-w-xs space-y-2 z-10">
                            <p className="text-[10px] text-emerald-200 uppercase tracking-wider font-semibold">Pintasan Akses Publik / Asisten:</p>
                            <div className="flex gap-2">
                                <button onClick={() => onPublicAccess('scan')} className="flex-1 p-2 rounded-xl flex items-center justify-center gap-1.5 transition-all border shadow-sm bg-white/20 hover:bg-white/30 text-white border-white/30 text-xs font-semibold backdrop-blur-sm">
                                    <i className="ph ph-qr-code text-base"></i>
                                    <span>Scan QR</span>
                                </button>
                                <button onClick={() => onPublicAccess('disiplin')} className="flex-1 p-2 rounded-xl flex items-center justify-center gap-1.5 transition-all border shadow-sm bg-white/20 hover:bg-white/30 text-white border-white/30 text-xs font-semibold backdrop-blur-sm">
                                    <i className="ph ph-warning-octagon text-base"></i>
                                    <span>Kedisiplinan</span>
                                </button>
                            </div>
                        </div>

                        <div className="absolute top-[-10%] right-[-10%] w-64 h-64 bg-emerald-500 rounded-full blur-3xl opacity-50"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-64 h-64 bg-emerald-700 rounded-full blur-3xl opacity-50"></div>
                    </div>

                    <div className="md:w-1/2 flex items-center justify-center p-8 bg-gray-50">
                        <Card className="w-full max-w-md p-8 shadow-xl border-0">
                            <div className="text-center mb-8">
                                <h2 className="text-2xl font-bold text-gray-800">
                                    Selamat Datang di SIAP
                                </h2>
                                <p className="mt-2 text-sm text-gray-500">
                                    Sistem Informasi dan Absensi PAI (Akses Login Guru & Admin)
                                </p>
                            </div>

                            {error && (
                                <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm flex items-start gap-2">
                                    <i className="ph ph-warning-circle text-lg mt-0.5"></i>
                                    <span>{error}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap Guru PAI</label>
                                    <input 
                                        type="text" 
                                        required
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none"
                                        placeholder="Contoh: Ulfatul Husna, M.Pd."
                                        value={nama}
                                        onChange={(e) => setNama(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">NIP / Password (Ketik 0 jika Non-NIP)</label>
                                    <input 
                                        type="text" 
                                        required
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none"
                                        placeholder="Masukkan NIP atau angka 0"
                                        value={nip}
                                        onChange={(e) => setNip(e.target.value)}
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2 mt-4 shadow-sm"
                                >
                                    <span>Masuk ke Sistem</span>
                                    <i className="ph ph-sign-in"></i>
                                </button>
                            </form>
                        </Card>
                    </div>
                </div>
            );
        };

        const Sidebar = ({ currentView, setView, user, onLogout }) => {
            const menuItems = [
                { id: 'dashboard', icon: 'squares-four', label: 'Dashboard' },
                { id: 'absen', icon: 'clipboard-text', label: 'Kelola Absen' },
                { id: 'disiplin', icon: 'warning-octagon', label: 'Kedisiplinan' },
                { id: 'data-siswa', icon: 'users', label: 'Data Siswa' },
                { id: 'data-guru', icon: 'chalkboard-teacher', label: 'Data Guru PAI' },
                { id: 'laporan', icon: 'file-text', label: 'Laporan' },
                { id: 'scan', icon: 'qr-code', label: 'Scan Absensi' },
            ];

            return (
                <div className="w-64 bg-white border-r border-gray-200 h-screen fixed left-0 top-0 flex flex-col hidden md:flex">
                    <div className="p-6 border-b border-gray-100 flex items-center gap-3">
                        <div className="bg-emerald-600 text-white p-2 rounded-lg">
                            <i className="ph ph-book-bookmark text-2xl"></i>
                        </div>
                        <div>
                            <h1 className="font-bold text-gray-800 text-lg leading-tight">SIAP PAI</h1>
                            <span className="text-xs text-gray-500">SMAN 1 Krembung</span>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto py-4">
                        <nav className="space-y-1 px-3">
                            {menuItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setView(item.id)}
                                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                                        currentView === item.id 
                                        ? 'bg-emerald-50 text-emerald-700' 
                                        : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                                    }`}
                                >
                                    <i className={`ph ph-${item.icon} text-lg ${currentView === item.id ? 'text-emerald-600' : 'text-gray-400'}`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                    </div>

                    <div className="p-4 border-t border-gray-100">
                        <div className="bg-gray-50 p-3 rounded-lg flex items-center gap-3 mb-3">
                            <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                                {user.nama.charAt(0)}
                            </div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-medium text-gray-900 truncate">{user.nama}</p>
                                <p className="text-xs text-gray-500 truncate capitalize">{user.role}</p>
                            </div>
                        </div>
                        <button 
                            onClick={onLogout}
                            className="w-full flex items-center justify-center gap-2 text-sm text-red-600 hover:bg-red-50 py-2 rounded-lg transition-colors font-medium"
                        >
                            <i className="ph ph-sign-out"></i>
                            Keluar
                        </button>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ user, setView }) => {
            const menus = [
                { id: 'scan', title: 'Scan QR Code', desc: 'Presensi instan dengan scan ID Card.', icon: 'qr-code', color: 'bg-indigo-500' },
                { id: 'absen', title: 'Kelola Absen', desc: 'Input kehadiran siswa di kelas dan sholat.', icon: 'clipboard-text', color: 'bg-blue-500' },
                { id: 'disiplin', title: 'Catatan Kedisiplinan', desc: 'Catat pelanggaran ringan hingga berat.', icon: 'warning-octagon', color: 'bg-orange-500' },
                { id: 'data-siswa', title: 'Data Siswa', desc: 'Lihat daftar siswa SMAN 1 Krembung.', icon: 'users', color: 'bg-emerald-500' },
                { id: 'laporan', title: 'Laporan', desc: 'Rekap kehadiran & kedisiplinan.', icon: 'file-text', color: 'bg-purple-500' },
            ];

            return (
                <div className="fade-in">
                    <div className="mb-8">
                        <h2 className="text-2xl font-bold text-gray-800">Dashboard</h2>
                        <p className="text-gray-600">Selamat datang kembali, <strong>{user.nama}</strong>. {user.role === 'admin' && <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full ml-2">Akses Admin</span>}</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        {menus.map(menu => (
                            <Card key={menu.id} className="hover:shadow-md transition-shadow cursor-pointer group">
                                <div className="p-6" onClick={() => setView(menu.id)}>
                                    <div className={`${menu.color} w-12 h-12 rounded-lg flex items-center justify-center text-white mb-4 group-hover:scale-110 transition-transform`}>
                                        <i className={`ph ph-${menu.icon} text-2xl`}></i>
                                    </div>
                                    <h3 className="font-semibold text-gray-800 mb-1">{menu.title}</h3>
                                    <p className="text-sm text-gray-500 line-clamp-2">{menu.desc}</p>
                                </div>
                            </Card>
                        ))}
                    </div>

                    <div className="mt-8 bg-blue-50 border border-blue-100 rounded-xl p-6 flex gap-4">
                        <i className="ph ph-info text-2xl text-blue-600 flex-shrink-0"></i>
                        <div>
                            <h4 className="font-semibold text-blue-900 mb-1">Informasi Sistem</h4>
                            <p className="text-sm text-blue-800">
                                Sistem ini digunakan untuk mendata kehadiran siswa pada jam pelajaran PAI dan pelaksanaan sholat Dhuha, Dzuhur, dan Ashar. Data yang diinputkan akan langsung tersinkronisasi ke pusat data sekolah.
                                <br/><br/><strong>Catatan:</strong> Presensi dinonaktifkan secara otomatis pada hari Sabtu dan Ahad.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const KelolaAbsen = ({ showToast, user, siswaList }) => {
            const [selectedKelas, setSelectedKelas] = React.useState('');
            const [selectedKategori, setSelectedKategori] = React.useState('');
            const [tanggal, setTanggal] = React.useState(new Date().toISOString().split('T')[0]);
            const [absensi, setAbsensi] = React.useState({});
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const d = new Date(tanggal);
            const isWeekend = d.getDay() === 0 || d.getDay() === 6;

            const siswaInClass = React.useMemo(() => {
                return siswaList.filter(s => s.kelas.trim().toUpperCase() === selectedKelas.trim().toUpperCase());
            }, [selectedKelas, siswaList]);

            React.useEffect(() => {
                const initialAbsen = {};
                siswaInClass.forEach(s => {
                    initialAbsen[s.idUnik] = 'Hadir';
                });
                setAbsensi(initialAbsen);
            }, [siswaInClass, selectedKelas, selectedKategori]);

            const handleStatusChange = (idUnik, status) => {
                setAbsensi(prev => ({ ...prev, [idUnik]: status }));
            };

            const handleSubmit = async () => {
                if(isWeekend) {
                    showToast("Tidak dapat menyimpan data pada hari libur (Sabtu/Ahad).", "error");
                    return;
                }
                if (!selectedKelas || !selectedKategori) {
                    showToast("Pilih Kelas dan Kategori Presensi terlebih dahulu.", "error");
                    return;
                }
                if (siswaInClass.length === 0) {
                    showToast("Tidak ada siswa terdaftar di kelas ini.", "error");
                    return;
                }

                setIsSubmitting(true);
                
                const payload = {
                    action: 'presensi',
                    tanggal: tanggal,
                    guru: user.nama,
                    kelas: selectedKelas,
                    kategori: selectedKategori,
                    data: siswaInClass.map(siswa => ({
                        nis: siswa.nis || '-',
                        nama: siswa.nama,
                        status: absensi[siswa.idUnik] || 'Hadir'
                    }))
                };

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    showToast("Data presensi berhasil dikirim ke server.", "success");
                    setSelectedKelas('');
                    setSelectedKategori('');
                } catch (error) {
                    showToast("Gagal mengirim data. Periksa koneksi internet.", "error");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fade-in">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6">Kelola Absensi</h2>
                    
                    {isWeekend && (
                         <div className="bg-orange-50 border-l-4 border-orange-500 p-4 mb-6 rounded-r-lg flex gap-3">
                            <i className="ph ph-calendar-x text-xl text-orange-600"></i>
                            <div>
                                <h3 className="font-medium text-orange-800">Hari Libur</h3>
                                <p className="text-sm text-orange-700">Tanggal yang dipilih adalah hari Sabtu/Ahad. Input presensi dinonaktifkan.</p>
                            </div>
                        </div>
                    )}

                    <Card className="p-6 mb-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                                <input 
                                    type="date" 
                                    value={tanggal}
                                    onChange={(e) => setTanggal(e.target.value)}
                                    className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Kelas ({siswaList.length} Total Siswa)</label>
                                <select 
                                    value={selectedKelas}
                                    onChange={(e) => setSelectedKelas(e.target.value)}
                                    className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white"
                                >
                                    <option value="">-- Pilih Kelas --</option>
                                    {KELAS_LIST.map(k => (
                                        <option key={k} value={k}>
                                            {k} ({siswaList.filter(s => s.kelas.trim().toUpperCase() === k.toUpperCase()).length} Siswa)
                                        </option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Kategori Presensi</label>
                                <select 
                                    value={selectedKategori}
                                    onChange={(e) => setSelectedKategori(e.target.value)}
                                    className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white"
                                >
                                    <option value="">-- Pilih Kategori --</option>
                                    {KATEGORI_PRESENSI.map(k => <option key={k} value={k}>{k}</option>)}
                                </select>
                            </div>
                        </div>
                    </Card>

                    {selectedKelas && selectedKategori && !isWeekend && (
                        <Card className="overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-gray-50 border-b border-gray-200 text-gray-700">
                                        <tr>
                                            <th className="px-6 py-4 font-semibold">NIS / ID</th>
                                            <th className="px-6 py-4 font-semibold">Nama Siswa</th>
                                            <th className="px-6 py-4 font-semibold text-center">Status Kehadiran</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {siswaInClass.map(siswa => (
                                            <tr key={siswa.idUnik} className="hover:bg-gray-50/50">
                                                <td className="px-6 py-4 text-gray-600">{siswa.nis || '-'}</td>
                                                <td className="px-6 py-4 font-medium text-gray-900">{siswa.nama}</td>
                                                <td className="px-6 py-4">
                                                    <div className="flex justify-center gap-2">
                                                        {STATUS_PRESENSI.map(status => {
                                                            let colorClass = "bg-gray-100 text-gray-600 hover:bg-gray-200 border-transparent";
                                                            if (absensi[siswa.idUnik] === status) {
                                                                if(status === 'Hadir') colorClass = "bg-green-100 text-green-700 border-green-500";
                                                                else if(status === 'Sakit' || status === 'Ijin') colorClass = "bg-blue-100 text-blue-700 border-blue-500";
                                                                else if(status === 'Alpha') colorClass = "bg-red-100 text-red-700 border-red-500";
                                                                else colorClass = "bg-orange-100 text-orange-700 border-orange-500";
                                                            }

                                                            return (
                                                                <button
                                                                    key={status}
                                                                    onClick={() => handleStatusChange(siswa.idUnik, status)}
                                                                    className={`px-3 py-1.5 rounded-md border text-xs font-medium transition-colors ${colorClass}`}
                                                                >
                                                                    {status}
                                                                </button>
                                                            )
                                                        })}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                        {siswaInClass.length === 0 && (
                                            <tr>
                                                <td colSpan="3" className="px-6 py-8 text-center text-gray-500">
                                                    Tidak ada siswa terdaftar di kelas <strong>{selectedKelas}</strong>.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            {siswaInClass.length > 0 && (
                                <div className="p-6 bg-gray-50 border-t border-gray-100 flex justify-end">
                                    <button 
                                        onClick={handleSubmit}
                                        disabled={isSubmitting}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 disabled:opacity-70"
                                    >
                                        {isSubmitting ? (
                                            <><i className="ph ph-spinner animate-spin"></i> Menyimpan...</>
                                        ) : (
                                            <><i className="ph ph-paper-plane-tilt"></i> Simpan Presensi</>
                                        )}
                                    </button>
                                </div>
                            )}
                        </Card>
                    )}
                </div>
            );
        };

        const Kedisiplinan = ({ showToast, user, siswaList, addDisiplinRecord }) => {
            const [selectedFilterKelas, setSelectedFilterKelas] = React.useState('');
            const [selectedSiswa, setSelectedSiswa] = React.useState('');
            const [kategori, setKategori] = React.useState('Ringan');
            const [keterangan, setKeterangan] = React.useState('');
            const [tindakan, setTindakan] = React.useState('');
            const [pelapor, setPelapor] = React.useState(user.role === 'public' ? '' : user.nama);
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const filteredSiswa = selectedFilterKelas ? siswaList.filter(s => s.kelas.trim().toUpperCase() === selectedFilterKelas.trim().toUpperCase()) : siswaList;

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!selectedSiswa) {
                    showToast("Pilih siswa terlebih dahulu", "error");
                    return;
                }
                if (user.role === 'public' && !pelapor.trim()) {
                    showToast("Silakan masukkan email atau nama Anda sebagai pelapor", "error");
                    return;
                }

                setIsSubmitting(true);
                const siswaObj = siswaList.find(s => s.idUnik === selectedSiswa);
                if (!siswaObj) {
                    showToast("Data siswa tidak ditemukan", "error");
                    setIsSubmitting(false);
                    return;
                }

                const poin = POIN_DISIPLIN[kategori];
                const namaPelapor = user.role === 'public' ? pelapor : user.nama;

                const payload = {
                    action: 'disiplin',
                    tanggal: new Date().toISOString().split('T')[0],
                    guru: namaPelapor,
                    nis: siswaObj.nis || '-',
                    nama: siswaObj.nama,
                    kelas: siswaObj.kelas,
                    kategori: kategori,
                    poin: poin,
                    keterangan: keterangan,
                    tindakan: tindakan
                };

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if(addDisiplinRecord) addDisiplinRecord(payload);
                    showToast("Data pelanggaran berhasil dicatat.", "success");
                    setSelectedSiswa('');
                    setKeterangan('');
                    setTindakan('');
                    setKategori('Ringan');
                    if (user.role === 'public') setPelapor('');
                } catch (error) {
                    showToast("Gagal menyimpan data.", "error");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fade-in max-w-2xl mx-auto">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6">Input Kedisiplinan Siswa</h2>
                    
                    <Card className="p-8">
                        <form onSubmit={handleSubmit} className="space-y-6">
                            {user.role === 'public' && (
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email / Nama Pelapor (Publik)</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={pelapor}
                                        onChange={(e) => setPelapor(e.target.value)}
                                        placeholder="Masukkan email / nama pelapor"
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none bg-white"
                                    />
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Filter Kelas</label>
                                    <select 
                                        value={selectedFilterKelas}
                                        onChange={(e) => {
                                            setSelectedFilterKelas(e.target.value);
                                            setSelectedSiswa('');
                                        }}
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none bg-white"
                                    >
                                        <option value="">-- Semua Kelas ({siswaList.length} Siswa) --</option>
                                        {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Pilih Siswa</label>
                                    <select 
                                        required
                                        value={selectedSiswa}
                                        onChange={(e) => setSelectedSiswa(e.target.value)}
                                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none bg-white"
                                    >
                                        <option value="">-- Pilih Siswa --</option>
                                        {filteredSiswa.map(s => (
                                            <option key={s.idUnik} value={s.idUnik}>{s.nama} - {s.kelas} {s.nis ? `(NIS: ${s.nis})` : ''}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">Kategori & Poin Pelanggaran</label>
                                <div className="flex gap-4">
                                    {KATEGORI_DISIPLIN.map(kat => (
                                        <label key={kat} className={`flex-1 cursor-pointer rounded-lg border p-4 flex flex-col items-center gap-2 transition-all ${kategori === kat ? 'border-orange-500 bg-orange-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                                            <input 
                                                type="radio" 
                                                name="kategori" 
                                                value={kat}
                                                checked={kategori === kat}
                                                onChange={(e) => setKategori(e.target.value)}
                                                className="sr-only"
                                            />
                                            <div className={`w-4 h-4 rounded-full border-2 ${kategori === kat ? 'border-orange-500 bg-orange-500' : 'border-gray-300'}`}></div>
                                            <span className={`font-medium ${kategori === kat ? 'text-orange-700' : 'text-gray-600'}`}>{kat}</span>
                                            <span className={`text-xs px-2 py-1 rounded-full ${kategori === kat ? 'bg-orange-200 text-orange-800' : 'bg-gray-100 text-gray-500'}`}>{POIN_DISIPLIN[kat]} Poin</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Keterangan / Deskripsi Pelanggaran</label>
                                <textarea 
                                    required
                                    rows="2"
                                    value={keterangan}
                                    onChange={(e) => setKeterangan(e.target.value)}
                                    className="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none resize-none"
                                    placeholder="Jelaskan detail pelanggaran..."
                                ></textarea>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Tindakan / Sanksi yang Diberikan</label>
                                <input 
                                    type="text" 
                                    required
                                    value={tindakan}
                                    onChange={(e) => setTindakan(e.target.value)}
                                    className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none"
                                    placeholder="Contoh: Pembinaan lisan / Panggilan orang tua / Surat Peringatan"
                                />
                            </div>

                            <button 
                                type="submit" 
                                disabled={isSubmitting}
                                className="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 rounded-lg transition-colors flex justify-center items-center gap-2 disabled:opacity-70"
                            >
                                {isSubmitting ? (
                                     <><i className="ph ph-spinner animate-spin"></i> Menyimpan...</>
                                ) : (
                                     <><i className="ph ph-check-circle"></i> Catat Pelanggaran</>
                                )}
                            </button>
                        </form>
                    </Card>
                </div>
            );
        };

        const DataSiswaView = ({ siswaList, setSiswaList, showToast }) => {
            const [showInputModal, setShowInputModal] = React.useState(false);
            const [showQRModal, setShowQRModal] = React.useState(false);
            const [qrFilterKelas, setQrFilterKelas] = React.useState('');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [massData, setMassData] = React.useState('');
            const fileInputRef = React.useRef(null);

            const filteredSiswaTable = siswaList.filter(s => 
                s.nama.toLowerCase().includes(searchQuery.toLowerCase()) || 
                (s.nis && s.nis.toLowerCase().includes(searchQuery.toLowerCase())) ||
                s.kelas.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const processNewStudents = (rawRows) => {
                const newStudents = [];
                rawRows.forEach((b, index) => {
                    if(b.trim() === '') return;
                    const parts = b.split(/[,;|\t]/).map(p => p.trim());
                    if(parts.length >= 3) {
                        if (index === 0 && (parts[0].toLowerCase() === 'nis' || parts[1].toLowerCase() === 'nama')) return;
                        
                        const nisVal = parts[0] && parts[0] !== '0' && parts[0] !== '-' ? parts[0] : '';
                        const namaVal = parts[1];
                        const kelasVal = parts[2];
                        
                        const idUnik = nisVal ? `NIS-${nisVal}` : `${kelasVal}-${namaVal.replace(/\s+/g, '')}`;

                        newStudents.push({
                            idUnik: idUnik,
                            nis: nisVal,
                            nama: namaVal,
                            kelas: kelasVal
                        });
                    }
                });
                return newStudents;
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const baris = text.split('\n');
                    const newStudents = processNewStudents(baris);

                    if(newStudents.length > 0) {
                        const combined = [...siswaList];
                        newStudents.forEach(ns => {
                            const existingIdx = combined.findIndex(s => s.idUnik === ns.idUnik || (s.nama.toLowerCase() === ns.nama.toLowerCase() && s.kelas.toLowerCase() === ns.kelas.toLowerCase()));
                            if(existingIdx >= 0) {
                                combined[existingIdx] = ns;
                            } else {
                                combined.push(ns);
                            }
                        });
                        
                        setSiswaList(combined);
                        showToast(`${newStudents.length} Data siswa berhasil diunggah dan disinkronkan.`, "success");
                    } else {
                        showToast("Format file CSV tidak valid. Pastikan kolom: NIS, Nama, Kelas", "error");
                    }
                    e.target.value = null;
                };
                reader.readAsText(file);
            };

            const handleMassInput = () => {
                if(!massData.trim()) return;
                
                const baris = massData.split('\n');
                const newStudents = processNewStudents(baris);

                if(newStudents.length > 0) {
                    const combined = [...siswaList];
                    newStudents.forEach(ns => {
                        const existingIdx = combined.findIndex(s => s.idUnik === ns.idUnik || (s.nama.toLowerCase() === ns.nama.toLowerCase() && s.kelas.toLowerCase() === ns.kelas.toLowerCase()));
                        if(existingIdx >= 0) {
                            combined[existingIdx] = ns;
                        } else {
                            combined.push(ns);
                        }
                    });
                    
                    setSiswaList(combined);
                    showToast(`${newStudents.length} Data siswa massal berhasil disimpan & disinkronkan.`, "success");
                    setShowInputModal(false);
                    setMassData('');
                } else {
                    showToast("Format data tidak valid. Pastikan format: NIS, Nama, Kelas", "error");
                }
            };

            const handleDeleteSiswa = (idUnik) => {
                if (confirm(`Yakin ingin menghapus data siswa ini?`)) {
                    const updated = siswaList.filter(s => s.idUnik !== idUnik);
                    setSiswaList(updated);
                    showToast("Data siswa berhasil dihapus.", "success");
                }
            };

            const handleClearAllSiswa = () => {
                if (confirm("PERINGATAN: Tindakan ini akan menghapus seluruh data siswa di sistem. Lanjutkan?")) {
                    setSiswaList([]);
                    showToast("Semua data siswa dikosongkan.", "success");
                }
            };

            return (
                <div className="fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">Data Siswa SMAN 1 Krembung</h2>
                            <p className="text-sm text-gray-500">Total terdaftar: <strong>{siswaList.length} Siswa</strong></p>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto flex-wrap">
                            <input 
                                type="file" 
                                accept=".csv" 
                                ref={fileInputRef} 
                                onChange={handleFileUpload} 
                                className="hidden" 
                            />
                            <button onClick={() => fileInputRef.current.click()} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2 shadow-sm">
                                <i className="ph ph-upload-simple text-lg"></i> Upload CSV
                            </button>
                            <button onClick={() => setShowInputModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2 shadow-sm">
                                <i className="ph ph-clipboard-text text-lg"></i> Input Massal
                            </button>
                            <button onClick={() => setShowQRModal(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2 shadow-sm">
                                <i className="ph ph-qr-code text-lg"></i> Cetak QR Massal (F4)
                            </button>
                            <button onClick={handleClearAllSiswa} className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg text-sm font-medium transition-colors border border-red-200" title="Kosongkan Semua Siswa">
                                <i className="ph ph-trash text-base"></i>
                            </button>
                        </div>
                    </div>

                    <div className="mb-4">
                        <input 
                            type="text" 
                            placeholder="Cari berdasarkan Nama, NIS, atau Kelas..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full md:w-96 px-4 py-2.5 rounded-lg border border-gray-300 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-white"
                        />
                    </div>

                    <Card className="overflow-hidden">
                        <div className="overflow-x-auto max-h-[500px]">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-gray-50 border-b border-gray-200 text-gray-700 sticky top-0 z-10">
                                    <tr>
                                        <th className="px-6 py-4 font-semibold">NIS</th>
                                        <th className="px-6 py-4 font-semibold">Nama Siswa</th>
                                        <th className="px-6 py-4 font-semibold">Kelas</th>
                                        <th className="px-6 py-4 font-semibold text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {filteredSiswaTable.map((row) => (
                                        <tr key={row.idUnik} className="hover:bg-gray-50">
                                            <td className="px-6 py-4 text-gray-600">{row.nis || <span className="text-gray-400 italic">Tanpa NIS</span>}</td>
                                            <td className="px-6 py-4 font-medium text-gray-900">{row.nama}</td>
                                            <td className="px-6 py-4 text-gray-600 font-semibold">{row.kelas}</td>
                                            <td className="px-6 py-4 text-center">
                                                <button 
                                                    onClick={() => handleDeleteSiswa(row.idUnik)}
                                                    className="text-red-500 hover:text-red-700 p-1.5 rounded-lg hover:bg-red-50 transition"
                                                    title="Hapus Siswa"
                                                >
                                                    <i className="ph ph-trash text-base"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredSiswaTable.length === 0 && (
                                        <tr><td colSpan="4" className="px-6 py-8 text-center text-gray-500">Tidak ada data siswa yang cocok dengan pencarian.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>

                    {/* Modal Input Massal */}
                    {showInputModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 fade-in">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                                    <h3 className="font-bold text-gray-800">Input Data Siswa Massal</h3>
                                    <button onClick={() => setShowInputModal(false)} className="text-gray-500 hover:text-red-500"><i className="ph ph-x text-xl"></i></button>
                                </div>
                                <div className="p-6">
                                    <p className="text-sm text-gray-600 mb-2">Tempel (Paste) data dari Excel dengan urutan kolom: <strong>NIS (kosongkan/- jika belum ada), Nama Lengkap, Kelas</strong>.</p>
                                    <textarea 
                                        rows="10" 
                                        className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none whitespace-pre font-mono"
                                        placeholder="-	Abdullah Fachry	X-1&#10;-	Aisyah Putri	X-1"
                                        value={massData}
                                        onChange={(e) => setMassData(e.target.value)}
                                    ></textarea>
                                </div>
                                <div className="p-4 border-t border-gray-100 flex justify-end gap-2 bg-gray-50">
                                    <button onClick={() => setShowInputModal(false)} className="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-200 font-medium text-sm">Batal</button>
                                    <button onClick={handleMassInput} className="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm flex items-center gap-2">
                                        <i className="ph ph-floppy-disk"></i> Simpan & Sinkronkan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Cetak QR Massal dengan Filter Kelas (F4 Ready) */}
                    {showQRModal && (
                        <div className="fixed inset-0 bg-black/50 flex flex-col items-center p-4 z-50 fade-in overflow-y-auto">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-5xl my-8 flex flex-col">
                                <div className="p-4 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center sticky top-0 bg-white z-10 no-print gap-4">
                                    <div>
                                        <h3 className="font-bold text-gray-800">Cetak QR Code Siswa (Ukuran Kertas F4)</h3>
                                        <p className="text-xs text-gray-500">Format grid teroptimasi otomatis untuk siap print di kertas F4</p>
                                    </div>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <select 
                                            value={qrFilterKelas}
                                            onChange={(e) => setQrFilterKelas(e.target.value)}
                                            className="px-3 py-2 rounded-lg border border-gray-300 text-sm outline-none bg-white font-medium"
                                        >
                                            <option value="">Semua Kelas</option>
                                            {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                                        </select>
                                        <button onClick={() => window.print()} className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm flex items-center gap-2">
                                            <i className="ph ph-printer"></i> Cetak F4 (Print)
                                        </button>
                                        <button onClick={() => setShowQRModal(false)} className="px-4 py-2 rounded-lg bg-red-100 text-red-600 hover:bg-red-200 font-medium text-sm">
                                            Tutup
                                        </button>
                                    </div>
                                </div>
                                
                                <div id="print-area" className="p-8 bg-white grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-4">
                                    {siswaList.filter(s => qrFilterKelas === '' || s.kelas.trim().toUpperCase() === qrFilterKelas.toUpperCase()).map(siswa => (
                                        <div key={siswa.idUnik} className="print-card border border-gray-300 rounded-lg p-3 flex flex-col items-center text-center bg-white shadow-xs">
                                            <h4 className="font-bold text-xs text-gray-800 mb-1 leading-tight line-clamp-2 min-h-[2rem]">{siswa.nama}</h4>
                                            <img 
                                                src={`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(siswa.idUnik)}`} 
                                                alt={`QR ${siswa.nama}`} 
                                                className="w-20 h-20 mb-1.5"
                                            />
                                            <span className="text-[11px] font-semibold bg-gray-100 px-2 py-0.5 rounded w-full truncate text-gray-700">{siswa.nis || 'Tanpa NIS'}</span>
                                            <span className="text-[10px] font-medium text-gray-500 mt-0.5">Kelas {siswa.kelas}</span>
                                        </div>
                                    ))}
                                    {siswaList.filter(s => qrFilterKelas === '' || s.kelas.trim().toUpperCase() === qrFilterKelas.toUpperCase()).length === 0 && (
                                        <div className="col-span-full text-center text-gray-500 py-8">
                                            Tidak ada data siswa untuk kelas ini.
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LaporanView = ({ disiplinRecords, user }) => {
            const [filterKelas, setFilterKelas] = React.useState('');

            const rekapMap = {};
            disiplinRecords.forEach(r => {
                if (!filterKelas || r.kelas.trim().toUpperCase() === filterKelas.toUpperCase()) {
                    if(!rekapMap[r.nis + r.nama]) {
                        rekapMap[r.nis + r.nama] = { nis: r.nis, nama: r.nama, kelas: r.kelas, totalPoin: 0, pelanggaran: [] };
                    }
                    rekapMap[r.nis + r.nama].totalPoin += r.poin;
                    rekapMap[r.nis + r.nama].pelanggaran.push(r);
                }
            });
            const rekapArray = Object.values(rekapMap).sort((a, b) => b.totalPoin - a.totalPoin);

            return (
                <div className="fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">Laporan & Rekapitulasi</h2>
                        <div className="flex items-center gap-2 w-full md:w-auto">
                            <label className="text-sm font-medium text-gray-600 shrink-0">Filter Kelas:</label>
                            <select 
                                value={filterKelas}
                                onChange={(e) => setFilterKelas(e.target.value)}
                                className="w-full md:w-auto px-4 py-2 rounded-lg border border-gray-300 text-sm outline-none bg-white focus:ring-2 focus:ring-emerald-500"
                            >
                                <option value="">-- Semua Kelas --</option>
                                {KELAS_LIST.map(k => <option key={k} value={k}>{k}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <div className="flex flex-col items-center justify-center py-8 px-4 text-center bg-white rounded-xl shadow-sm border border-gray-100 mb-8">
                        <div className="bg-emerald-50 p-4 rounded-full mb-4 text-emerald-600">
                            <i className="ph ph-file-text text-4xl"></i>
                        </div>
                        <h3 className="text-lg font-bold text-gray-700 mb-2">
                            Pusat Data Spreadsheet (Real-time)
                        </h3>
                        <p className="text-gray-500 max-w-md mb-4 text-sm leading-relaxed">
                            Data mentah laporan presensi dan kedisiplinan tersinkronisasi langsung ke Google Spreadsheet SMAN 1 Krembung. 
                        </p>
                        <a href={SPREADSHEET_URL} target="_blank" className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                            Buka Spreadsheet Data <i className="ph ph-arrow-square-out"></i>
                        </a>
                    </div>

                    {user.role === 'admin' && (
                        <div>
                            <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <i className="ph ph-chart-bar text-orange-500"></i>
                                Rekap Poin Kedisiplinan Siswa (Akses Admin)
                            </h3>
                            <Card className="overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm whitespace-nowrap">
                                        <thead className="bg-gray-50 border-b border-gray-200 text-gray-700">
                                            <tr>
                                                <th className="px-6 py-4 font-semibold">NIS</th>
                                                <th className="px-6 py-4 font-semibold">Nama Siswa</th>
                                                <th className="px-6 py-4 font-semibold">Kelas</th>
                                                <th className="px-6 py-4 font-semibold">Total Poin</th>
                                                <th className="px-6 py-4 font-semibold">Riwayat & Tindakan Pelanggaran</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {rekapArray.map((row, rIdx) => (
                                                <tr key={rIdx} className="hover:bg-gray-50">
                                                    <td className="px-6 py-4 text-gray-600">{row.nis || '-'}</td>
                                                    <td className="px-6 py-4 font-medium text-gray-900">{row.nama}</td>
                                                    <td className="px-6 py-4 text-gray-600">{row.kelas}</td>
                                                    <td className="px-6 py-4">
                                                        <span className={`px-2 py-1 rounded-full text-xs font-bold ${row.totalPoin >= 40 ? 'bg-red-100 text-red-700' : (row.totalPoin >= 20 ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700')}`}>
                                                            {row.totalPoin} Poin
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4 text-gray-600 text-xs">
                                                        <ul className="space-y-1">
                                                            {row.pelanggaran.map((p, idx) => (
                                                                <li key={idx} className="bg-gray-50 p-1.5 rounded border border-gray-200">
                                                                    <strong className="text-orange-700">[{p.kategori}]</strong> {p.keterangan} 
                                                                    <br/><span className="italic text-gray-500">Tindakan: {p.tindakan || '-'}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </td>
                                                </tr>
                                            ))}
                                            {rekapArray.length === 0 && (
                                                <tr><td colSpan="5" className="px-6 py-8 text-center text-gray-500">Belum ada data rekapan kedisiplinan.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };
        
        const ScanQRCode = ({ showToast, user, siswaList }) => {
            const [kategori, setKategori] = React.useState('Kelas');
            const [isScanning, setIsScanning] = React.useState(false);
            const [scanHistory, setScanHistory] = React.useState([]);
            const lastScannedRef = React.useRef({ text: null, time: 0 });

            React.useEffect(() => {
                let html5QrCode;
                if (isScanning) {
                    html5QrCode = new Html5Qrcode("qr-reader");
                    html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 5, qrbox: { width: 250, height: 250 } },
                        async (decodedText) => {
                            let cleanText = decodedText.trim();
                            try {
                                cleanText = decodeURIComponent(cleanText);
                            } catch (e) {}

                            const now = Date.now();
                            if (lastScannedRef.current.text === cleanText && (now - lastScannedRef.current.time < 3000)) {
                                return; 
                            }
                            lastScannedRef.current = { text: cleanText, time: now };
                            
                            const today = new Date();
                            if (today.getDay() === 0 || today.getDay() === 6) {
                                showToast("Presensi dinonaktifkan pada hari libur.", "error");
                                return;
                            }

                            // SMARTER FUZZY MATCHING (Mencocokkan idUnik, NIS, atau nama secara fleksibel)
                            const query = cleanText.toLowerCase().replace(/\s+/g, '');
                            
                            let siswaObj = siswaList.find(s => {
                                const idUnikClean = (s.idUnik || '').toLowerCase().replace(/\s+/g, '');
                                const nisClean = (s.nis || '').toLowerCase().replace(/\s+/g, '');
                                const namaClean = (s.nama || '').toLowerCase().replace(/\s+/g, '');
                                
                                return query === idUnikClean || 
                                       (nisClean && query === nisClean) || 
                                       query.includes(idUnikClean) || 
                                       (nisClean && query.includes(nisClean)) ||
                                       query.includes(namaClean);
                            });

                            if (!siswaObj) {
                                showToast(`QR Code "${cleanText}" tidak ditemukan dalam database.`, "error");
                                return;
                            }

                            const beep = new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3');
                            beep.play().catch(e => {});

                            setScanHistory(prev => [{...siswaObj, waktu: new Date().toLocaleTimeString(), status: 'Mengirim...'}, ...prev].slice(0, 5));

                            const payload = {
                                action: 'presensi',
                                tanggal: today.toISOString().split('T')[0],
                                guru: user.nama,
                                kelas: siswaObj.kelas,
                                kategori: kategori,
                                data: [{
                                    nis: siswaObj.nis || '-',
                                    nama: siswaObj.nama,
                                    status: 'Hadir'
                                }]
                            };

                            try {
                                await fetch(GAS_URL, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                
                                showToast(`Berhasil absen: ${siswaObj.nama} (${siswaObj.kelas})`, "success");
                                
                                setScanHistory(prev => {
                                    const newHistory = [...prev];
                                    if(newHistory[0] && newHistory[0].idUnik === siswaObj.idUnik) {
                                        newHistory[0].status = 'Terkirim';
                                    }
                                    return newHistory;
                                });

                            } catch (error) {
                                showToast(`Gagal jaringan saat absen: ${siswaObj.nama}`, "error");
                            }
                        },
                        (errorMessage) => {}
                    ).catch(err => {
                        showToast("Kamera tidak diizinkan atau tidak ditemukan.", "error");
                        setIsScanning(false);
                    });
                }

                return () => {
                    if (html5QrCode && html5QrCode.isScanning) {
                        html5QrCode.stop().then(() => {
                            html5QrCode.clear();
                        }).catch(console.error);
                    }
                };
            }, [isScanning, kategori, siswaList, user.nama]);

            return (
                <div className="fade-in max-w-2xl mx-auto">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6">Scan QR Code Kehadiran</h2>
                    
                    <Card className="p-6 mb-6">
                        <div className="mb-4">
                            <label className="block text-sm font-medium text-gray-700 mb-2">Tujuan Scan (Kategori Presensi):</label>
                            <select 
                                value={kategori}
                                onChange={(e) => setKategori(e.target.value)}
                                disabled={isScanning}
                                className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white disabled:opacity-50"
                            >
                                {KATEGORI_PRESENSI.map(k => <option key={k} value={k}>{k}</option>)}
                            </select>
                        </div>

                        <div className="flex flex-col items-center justify-center p-4 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 mb-4 min-h-[300px]">
                            <div id="qr-reader" className={`w-full max-w-sm overflow-hidden rounded-lg shadow-inner ${isScanning ? 'bg-black' : ''}`}></div>
                            
                            {!isScanning && (
                                <div className="text-center p-8">
                                    <i className="ph ph-camera text-5xl text-gray-400 mb-3"></i>
                                    <p className="text-gray-500 font-medium">Kamera Nonaktif</p>
                                    <p className="text-sm text-gray-400 mt-1">Pastikan memberi izin akses kamera pada perangkat.</p>
                                </div>
                            )}
                        </div>

                        <button 
                            onClick={() => setIsScanning(!isScanning)}
                            className={`w-full font-bold py-3.5 rounded-lg transition-colors flex justify-center items-center gap-2 text-white shadow-sm ${isScanning ? 'bg-red-500 hover:bg-red-600' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                        >
                            <i className={`ph text-xl ${isScanning ? 'ph-stop-circle' : 'ph-scan'}`}></i>
                            {isScanning ? 'Hentikan Kamera' : 'Mulai Scan QR Code'}
                        </button>
                    </Card>

                    {scanHistory.length > 0 && (
                        <Card className="overflow-hidden">
                            <div className="bg-gray-50 px-4 py-3 border-b border-gray-100 flex items-center justify-between">
                                <h3 className="font-semibold text-gray-700">Scan Terakhir</h3>
                                <span className="text-xs text-gray-500">Tersinkronisasi</span>
                            </div>
                            <ul className="divide-y divide-gray-100">
                                {scanHistory.map((sh, idx) => (
                                    <li key={idx} className="p-4 flex items-center justify-between bg-white hover:bg-gray-50">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
                                                <i className="ph ph-check"></i>
                                            </div>
                                            <div>
                                                <p className="font-semibold text-gray-800 text-sm">{sh.nama}</p>
                                                <p className="text-xs text-gray-500">{sh.kelas} • ID: {sh.nis || 'Tanpa NIS'}</p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <p className={`text-xs font-bold mb-0.5 ${sh.status === 'Mengirim...' ? 'text-orange-500' : 'text-emerald-600'}`}>{sh.status}</p>
                                            <p className="text-[10px] text-gray-400">{sh.waktu}</p>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        </Card>
                    )}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState('dashboard');
            const [publicView, setPublicView] = React.useState(null);
            const [toast, setToast] = React.useState(null);
            
            const [siswaList, setSiswaList] = React.useState(() => {
                const savedSiswa = localStorage.getItem('siap_siswa_list_v4');
                let parsed = [];
                if (savedSiswa) {
                    try {
                        parsed = JSON.parse(savedSiswa);
                    } catch (e) {}
                }
                
                if (!Array.isArray(parsed) || parsed.length === 0) {
                    parsed = INITIAL_SISWA_LIST;
                }

                return parsed.map(s => {
                    const cleanNama = s.nama ? s.nama.replace(/\s+/g, '') : 'Siswa';
                    const idUnik = s.nis && s.nis !== '0' && s.nis !== '-' ? `NIS-${s.nis}` : `${s.kelas}-${cleanNama}`;
                    return { ...s, idUnik };
                });
            });

            const [disiplinRecords, setDisiplinRecords] = React.useState(() => {
                const saved = localStorage.getItem('siap_disiplin_records');
                return saved ? JSON.parse(saved) : [];
            });

            React.useEffect(() => {
                localStorage.setItem('siap_siswa_list_v4', JSON.stringify(siswaList));
            }, [siswaList]);

            React.useEffect(() => {
                localStorage.setItem('siap_disiplin_records', JSON.stringify(disiplinRecords));
            }, [disiplinRecords]);

            const addDisiplinRecord = (record) => {
                setDisiplinRecords(prev => [record, ...prev]);
            };

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            const handleLoginSuccess = (userData, targetView = 'dashboard') => {
                setUser(userData);
                setView(targetView);
            };

            if (publicView) {
                const publicUser = { nama: 'Asisten / Publik', role: 'public' };
                
                return (
                    <div className="min-h-screen bg-gray-50 flex flex-col">
