                        <div className="bg-emerald-600 text-white p-4 flex items-center justify-between shadow-md">
                            <div className="flex items-center gap-2 font-bold">
                                <i className="ph ph-book-bookmark text-xl"></i> SIAP PAI - Akses Publik
                            </div>
                            <button onClick={() => setPublicView(null)} className="flex items-center gap-2 bg-white/20 px-4 py-2 rounded-lg hover:bg-white/30 transition text-sm font-medium">
                                <i className="ph ph-arrow-left"></i> Kembali ke Muka
                            </button>
                        </div>
                        
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            <div className="max-w-4xl mx-auto">
                                <div className="bg-blue-50 border border-blue-200 text-blue-800 p-4 rounded-xl mb-6 flex gap-3 shadow-sm">
                                    <i className="ph ph-info text-2xl shrink-0 mt-0.5"></i>
                                    <div>
                                        <h4 className="font-bold">Mode Akses Publik Aktif</h4>
                                        <p className="text-sm mt-1 text-blue-700">Anda dapat membantu menginput data tanpa login admin. Data akan langsung terkirim ke Spreadsheet pusat.</p>
                                    </div>
                                </div>

                                {publicView === 'scan' && <ScanQRCode showToast={showToast} user={publicUser} siswaList={siswaList} />}
                                {publicView === 'disiplin' && <Kedisiplinan showToast={showToast} user={publicUser} siswaList={siswaList} addDisiplinRecord={addDisiplinRecord} />}
                            </div>
                        </main>

                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </div>
                );
            }

            if (!user) {
                return <Login onLogin={handleLoginSuccess} onPublicAccess={setPublicView} />;
            }

            const renderContent = () => {
                switch (view) {
                    case 'dashboard': return <Dashboard user={user} setView={setView} />;
                    case 'absen': return <KelolaAbsen showToast={showToast} user={user} siswaList={siswaList} />;
                    case 'disiplin': return <Kedisiplinan showToast={showToast} user={user} siswaList={siswaList} addDisiplinRecord={addDisiplinRecord} />;
                    case 'data-siswa': return <DataSiswaView siswaList={siswaList} setSiswaList={setSiswaList} showToast={showToast} />;
                    case 'data-guru': return <DataView title="Data Guru PAI SMAN 1 Krembung" data={GURU_PAI} columns={[{header:'Nama Guru', accessor:'nama'}, {header:'NIP', accessor:'nip'}, {header:'Pangkat/Gol', accessor:'pangkat'}]} />;
                    case 'laporan': return <LaporanView disiplinRecords={disiplinRecords} user={user} />;
                    case 'scan': return <ScanQRCode showToast={showToast} user={user} siswaList={siswaList} />;
                    default: return <Dashboard user={user} setView={setView} />;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex">
                    <Sidebar currentView={view} setView={setView} user={user} onLogout={() => setUser(null)} />
                    
                    <div className="flex-1 md:ml-64 flex flex-col h-screen">
                        <div className="md:hidden bg-emerald-600 text-white p-4 flex items-center justify-between shadow-md">
                            <div className="flex items-center gap-2 font-bold">
                                <i className="ph ph-book-bookmark text-xl"></i> SIAP PAI
                            </div>
                            <button onClick={() => setView('dashboard')} className="p-2">
                                <i className="ph ph-squares-four text-2xl"></i>
                            </button>
                        </div>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {renderContent()}
                        </main>
                    </div>

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
